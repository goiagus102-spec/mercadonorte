<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Subir imagen</title>
</head>
<body>

<h2>Subir imagen</h2>

<input type="file" id="imagen" accept="image/*">
<br><br>
<input type="text" id="link" placeholder="acá aparece el link" readonly style="width:100%">

<script>
const CLOUD_NAME = "de6bivonf";
const UPLOAD_PRESET = "subir_imagen";

document.getElementById("imagen").addEventListener("change", async function () {
  const file = this.files[0];
  if (!file) return;

  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", UPLOAD_PRESET);

  const res = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`,
    { method: "POST", body: formData }
  );

  const data = await res.json();
  document.getElementById("link").value = data.secure_url;
});
</script>

</body>
</html>
